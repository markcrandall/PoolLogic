<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b7fc4">
  <title>PoolLogic</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>PoolLogic <span id="mock-badge" class="mock-badge hidden">MOCK</span></h1>
    <span id="com-dot" class="com-dot amber" role="status" aria-label="connection status"></span>
  </header>

  <div id="status-banner" class="status-banner"></div>
  <div id="freeze-banner" class="freeze-banner" role="status"></div>
  <button id="reconnect-btn" class="reconnect-btn hidden">Reconnect</button>

  <section id="temps" class="temps">
    <div class="temp"><span class="temp-label">Air</span><span id="air-temp">—</span><span class="temp-hint"></span></div>
    <div class="temp"><span class="temp-label">Pool</span><span id="pool-temp">—</span><span class="temp-hint" id="pool-temp-hint"></span></div>
    <div class="temp"><span class="temp-label">Spa</span><span id="spa-temp">—</span><span class="temp-hint" id="spa-temp-hint"></span></div>
    <div id="temps-as-of" class="temps-as-of"></div>
  </section>

  <main id="controls" class="controls disabled">
    <div class="control-row">
      <span class="control-label">Mode</span>
      <div class="mode-switch">
        <button id="btn-mode-pool" class="mode-btn" disabled>Pool</button>
        <button id="btn-mode-spa" class="mode-btn" disabled>Spa</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Heater <small id="heater-body" class="heater-body"></small></span>
      <button id="btn-heater" class="toggle-btn" disabled>Off</button>
      <div class="stepper">
        <button id="btn-step-down" class="step-btn" disabled>−</button>
        <span id="setpoint-value" class="setpoint">—°</span>
        <button id="btn-step-up" class="step-btn" disabled>+</button>
      </div>
    </div>
    <div class="control-row slider-row">
      <span class="slider-bound" id="slider-min"></span>
      <input type="range" id="setpoint-slider" step="1" disabled
             aria-label="heater setpoint">
      <span class="slider-bound" id="slider-max"></span>
    </div>
    <div class="control-row"><span class="control-label">Jets</span><button id="btn-jets" class="toggle-btn" disabled>Off</button></div>
    <div class="control-row"><span class="control-label">Cleaner</span><button id="btn-cleaner" class="toggle-btn" disabled>Off</button></div>
    <div class="control-row"><span class="control-label">Spillway</span><button id="btn-spillway" class="toggle-btn" disabled>Off</button></div>
    <div class="control-row"><span class="control-label">Pool Light</span><button id="btn-poolLight" class="toggle-btn" disabled>Off</button></div>
    <div class="control-row"><span class="control-label">Spa Light</span><button id="btn-spaLight" class="toggle-btn" disabled>Off</button></div>
    <div class="control-row">
      <span class="control-label">Light Show</span>
      <div class="mode-switch">
        <button id="btn-show-white" class="mode-btn" disabled>White</button>
        <button id="btn-show-caribbean" class="mode-btn" disabled>Caribbean</button>
        <button id="btn-show-party" class="mode-btn" disabled>Party</button>
      </div>
    </div>
  </main>

  <!-- Shown instead of the controls at /?config -->
  <section id="config-view" class="config-view hidden">
    <h2>Circuit map</h2>
    <table id="config-circuits" class="config-table">
      <thead>
        <tr><th>Name</th><th>ID</th><th>State</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="config-note" class="config-note"></p>

    <h2>What the panel reports</h2>
    <table id="panel-circuits" class="config-table">
      <thead>
        <tr><th>ID</th><th>Panel name</th><th>State</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="panel-note" class="config-note"></p>

    <a class="config-back" href="./">← back to controls</a>
  </section>

  <div id="toast" class="toast">Command failed — the pool didn't respond</div>

  <div class="app-version">M6</div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
